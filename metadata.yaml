name: astrbot_plugin_bot_watchdog
display_name: 互相看护
short_desc: 监控另一个 bot，连续掉线自动触发对方重启
desc: |
  给「另一个 bot」做健康看护的小插件：定时探测对方的健康检查地址，连续失败达到阈值后自动触发对方重启，让两台 bot 互相兜底。

  - 探测逻辑：只要请求能拿到任意 HTTP 响应（包括 401/403）就视为存活，只有连接失败、超时、DNS 解析失败才计为一次失败，避免把「服务在跑但要求鉴权」误判成掉线。
  - 连续失败达到阈值才触发动作，单次抖动不会重启对方。
  - 重启方式有两种：优先走对方面板的重启接口（可自动用账号密码登录拿 Token，无需手填长期 Token）；没有面板凭据时，退回到在指定会话里发一条重启指令作为兜底。
  - 两次自动重启之间有冷却时间，避免反复重启。
  - 插件自身重启后会自动继续看护，不会出现「一边重启完就没人管」的死锁。
  - 无指令、无工具，安装并配置后自动运行。
version: 1.0.0
author: 宁喵喵
repo: https://github.com/1875632098/astrbot_plugin_bot_watchdog
astrbot_version: ">=4.24.4"
support_platforms:
